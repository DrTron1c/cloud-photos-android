name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: the Ubuntu 26 image behind ubuntu-latest broke the Android SDK setup action.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The 24.04 image ships an Android SDK already; this action only tops it up.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Record build environment
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1
            java -version 2>&1
          } > env.log
          cat env.log

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests + release APK
        run: |
          gradle --no-daemon --stacktrace --continue :app:testReleaseUnitTest :app:assembleRelease :app:assembleReleaseTest :app:assembleReleaseTestAndroidTest 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Inspect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk CloudPhotos.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            "$AAPT2" dump badging CloudPhotos.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|uses-permission)" || true
            "$APKSIGNER" verify --print-certs CloudPhotos.apk 2>&1 || true
            ls -la CloudPhotos.apk
          } > badging.txt
          cat badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudPhotos-apk
          path: |
            CloudPhotos.apk
            app/build/launcher-test/CustomLauncher.apk
            app/build/outputs/apk/releaseTest/app-releaseTest.apk
            app/build/outputs/apk/androidTest/releaseTest/app-releaseTest-androidTest.apk
          if-no-files-found: error

      # A rolling "latest" release makes the APK one tap to download on the tablet.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest CloudPhotos.apk \
            --target "${{ github.sha }}" \
            --title "Cloud Photos build ${{ github.run_number }}" \
            --notes "Unofficial iCloud Photos client for Android 11+. Install CloudPhotos.apk. Built from ${{ github.sha }}."

      # Build output on a side branch so failures can be read without the Actions UI.
      - name: Push CI logs
        if: always()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q -b ci-logs
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > status.txt
          cp "$GITHUB_WORKSPACE"/build.log "$GITHUB_WORKSPACE"/env.log . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/badging.txt . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/CloudPhotos.apk . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/app/build/launcher-test/*.apk . 2>/dev/null || true
          grep -nE "^e: |^w: .*(deprecated|unused)|error:|FAILED|What went wrong|Could not|expected:|AssertionError" build.log > errors.txt 2>/dev/null || true
          mkdir -p test-results && cp -r "$GITHUB_WORKSPACE"/app/build/test-results/* test-results/ 2>/dev/null || true
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "CI run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  # Opens the new APK on an Android emulator to catch start-up crashes before you install it.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CloudPhotos-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke.sh
      - name: Push smoke results
        if: always()
        run: |
          git fetch -q origin ci-logs
          git worktree add -q --detach /tmp/ci FETCH_HEAD
          cd /tmp/ci
          rm -rf smoke
          cp -r "$GITHUB_WORKSPACE"/smoke . 2>/dev/null || mkdir -p smoke
          echo "${{ job.status }} run=${{ github.run_number }}" > smoke/status.txt
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Smoke ${{ github.run_number }}" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
