name: Build APK

on:
  push:
    # dev: same build and tests, but nothing is published.
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: the Ubuntu 26 image behind ubuntu-latest broke the Android SDK setup action.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The 24.04 image ships an Android SDK already; this action only tops it up.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Record build environment
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1
            java -version 2>&1
          } > env.log
          cat env.log

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests + release APK
        run: |
          gradle --no-daemon --stacktrace --continue :aicore:test :app:testReleaseUnitTest :app:assembleRelease :app:assembleReleaseTest :app:assembleReleaseTestAndroidTest 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # The app's private key lives only in GitHub's secret storage (CLOUDPHOTOS_SIGNING =
      # "<password>.<base64 PKCS12>"). The original key was public in this repo's history, so it
      # is used for one thing only: vouching for the new key ("key rotation"), with rollback off so
      # nothing signed with the old key can ever update the app again.
      - name: Sign release APK
        env:
          CLOUDPHOTOS_SIGNING: ${{ secrets.CLOUDPHOTOS_SIGNING }}
          OLD_KEY_COMMIT: 7a776fb1663e15722de38031dc66c7e88516a79e
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          K="$RUNNER_TEMP/keys"
          mkdir -p "$K"
          git fetch -q --depth=1 origin "$OLD_KEY_COMMIT"
          git show "$OLD_KEY_COMMIT:app/signing/cloudphotos.p12" > "$K/old.p12"
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          export OLD_PW=cloudphotos
          if [ -n "${CLOUDPHOTOS_SIGNING:-}" ]; then
            NEW_PW="${CLOUDPHOTOS_SIGNING%%.*}"
            echo "::add-mask::$NEW_PW"
            export NEW_PW
            printf '%s' "${CLOUDPHOTOS_SIGNING#*.}" | base64 -d > "$K/new.p12"
            "$APKSIGNER" rotate --out "$K/lineage" \
              --old-signer --ks "$K/old.p12" --ks-pass env:OLD_PW --set-rollback false \
              --new-signer --ks "$K/new.p12" --ks-pass env:NEW_PW
            "$APKSIGNER" sign --ks "$K/new.p12" --ks-pass env:NEW_PW --lineage "$K/lineage" \
              --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
              --rotation-min-sdk-version 28 --min-sdk-version 30 --out CloudPhotos.apk "$IN"
            echo "Signed with the new private key (rotated from the old one)."
          else
            echo "::warning::The CLOUDPHOTOS_SIGNING secret isn't set yet: signing with the old key so updates keep working."
            "$APKSIGNER" sign --ks "$K/old.p12" --ks-pass env:OLD_PW --min-sdk-version 30 --out CloudPhotos.apk "$IN"
          fi
          rm -rf "$K"

      - name: Inspect APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            "$AAPT2" dump badging CloudPhotos.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|uses-permission)" || true
            "$APKSIGNER" verify -v --print-certs CloudPhotos.apk 2>&1 | grep -vE "^WARNING" || true
            ls -la CloudPhotos.apk
          } > badging.txt
          cat badging.txt

      # Throwaway keys (made fresh each run) to prove on the test emulator that a rotated key
      # updates the app and that the retired key can no longer do so.
      - name: Key rotation test kit
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          R="$RUNNER_TEMP/rot"
          mkdir -p "$R" rotation
          for a in a b; do
            keytool -genkeypair -keystore "$R/$a.p12" -storetype PKCS12 -storepass testpass -keypass testpass \
              -alias "$a" -keyalg RSA -keysize 2048 -validity 365 -dname "CN=rotation test $a" 2>/dev/null
          done
          export PW=testpass
          "$APKSIGNER" rotate --out "$R/lineage" --old-signer --ks "$R/a.p12" --ks-pass env:PW --set-rollback false \
            --new-signer --ks "$R/b.p12" --ks-pass env:PW
          T=launcher/build/outputs/apk/release/launcher-release-unsigned.apk
          "$APKSIGNER" sign --ks "$R/a.p12" --ks-pass env:PW --min-sdk-version 30 --out rotation/1-old.apk "$T"
          "$APKSIGNER" sign --ks "$R/b.p12" --ks-pass env:PW --lineage "$R/lineage" \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --rotation-min-sdk-version 28 --min-sdk-version 30 --out rotation/2-rotated.apk "$T"
          cp rotation/1-old.apk rotation/3-old-again.apk
          "$APKSIGNER" verify -v --print-certs rotation/2-rotated.apk | grep -E "lineage|Signer|v3" | head -8 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudPhotos-apk
          path: |
            CloudPhotos.apk
            app/build/launcher-test/CustomLauncher.apk
            app/build/outputs/apk/releaseTest/app-releaseTest.apk
            app/build/outputs/apk/androidTest/releaseTest/app-releaseTest-androidTest.apk
            rotation/*.apk
          if-no-files-found: error

      # A rolling "latest" release makes the APK one tap to download on the tablet.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          # The app's updater reads "versionCode: N" and the newest change-log section from these notes.
          {
            echo "Unofficial iCloud Photos client for Android 11+. Install CloudPhotos.apk. Built from ${{ github.sha }}."
            echo
            echo "versionCode: ${{ github.run_number }}"
            echo
            awk '/^## /{n++} n==1' app/src/main/assets/changelog.md
          } > release-notes.txt
          gh release create latest CloudPhotos.apk \
            --target "${{ github.sha }}" \
            --title "Cloud Photos build ${{ github.run_number }}" \
            --notes-file release-notes.txt

      # Build output on a side branch so failures can be read without the Actions UI.
      - name: Push CI logs
        if: always()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q -b ci-logs
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > status.txt
          cp "$GITHUB_WORKSPACE"/build.log "$GITHUB_WORKSPACE"/env.log . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/badging.txt . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/CloudPhotos.apk . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/app/build/launcher-test/*.apk . 2>/dev/null || true
          grep -nE "^e: |^w: .*(deprecated|unused)|error:|FAILED|What went wrong|Could not|expected:|AssertionError" build.log > errors.txt 2>/dev/null || true
          mkdir -p test-results && cp -r "$GITHUB_WORKSPACE"/app/build/test-results/* test-results/ 2>/dev/null || true
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "CI run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name == 'main' && 'ci-logs' || 'ci-logs-dev' }}

  # Opens the new APK on an Android emulator to catch start-up crashes before you install it.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CloudPhotos-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke.sh
      - name: Push smoke results
        if: always()
        run: |
          B=${{ github.ref_name == 'main' && 'ci-logs' || 'ci-logs-dev' }}
          git fetch -q origin $B
          git worktree add -q --detach /tmp/ci FETCH_HEAD
          cd /tmp/ci
          rm -rf smoke
          cp -r "$GITHUB_WORKSPACE"/smoke . 2>/dev/null || mkdir -p smoke
          echo "${{ job.status }} run=${{ github.run_number }}" > smoke/status.txt
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Smoke ${{ github.run_number }}" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:$B
